name: Server veröffentlichen

# Veröffentlicht den Daten-Server (server/) auf Cloudflare Workers,
# sobald sich auf main etwas im Server ändert, oder per Hand unter "Actions".
on:
  push:
    branches: [main]
    paths: ["server/**", "shared/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Auf Cloudflare veröffentlichen
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
